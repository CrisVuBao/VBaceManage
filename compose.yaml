services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vbace_db
      POSTGRES_USER: vbace_dev
      POSTGRES_PASSWORD: vbace_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbace_dev -d vbace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: src/Host/VBace.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=vbace_db;Username=vbace_dev;Password=vbace_dev_password
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Secret=super-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
